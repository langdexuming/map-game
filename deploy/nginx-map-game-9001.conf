# map-game：HTTP 9001 提供 Vite 产物 + 将 /api 反代至 Spring Boot（本机 8080，context-path=/api）
# 由 /opt/homebrew/etc/nginx/nginx.conf 在 http 块内 include 本文件

server {
    listen 9001;
    listen [::]:9001;
    server_name _;

    root /Users/tiky/Projects/map-game/web/dist;
    index index.html;

    access_log /opt/homebrew/var/log/nginx/map-game-9001.access.log;
    error_log  /opt/homebrew/var/log/nginx/map-game-9001.error.log;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api {
        return 301 /api/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
