services:
  mysql:
    image: mysql:8.0
    container_name: mapgame-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: map_game
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mapgame_mysql:/var/lib/mysql
      - ./src/main/resources/db/migration/mysql:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: mapgame-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - mapgame_redis:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mapgame-rabbit
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mapgame_mysql:
  mapgame_redis:
