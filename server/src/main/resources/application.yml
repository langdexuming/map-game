spring:
  application:
    name: map-game-server
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

game:
  team:
    max-size: 5
  mission:
    pool-size: 5
    refresh-turn: 1
  travel:
    plane-price-factor: 1.5
    ship-price-factor: 0.8
    train-price-factor: 1.0
    event-rate: 0.25
    peak-price-rate: 1.3
    early-book-discount: 0.8
    refund-fee-rate: 0.3
  build:
    factor-default: 1.5
  event:
    global-rate: 0.1
    region-rate: 0.2
    trip-rate: 0.25
  redis:
    ttl-team-stats: 60
    ttl-tech-tree: 3600
  agent:
    rest-fatigue-per-turn: 30
    rest-coin-cost: 10
  passport:
    global-discount: 0.1
    mileage-golden: 2000
    stamp-global: 5

logging:
  level:
    root: INFO
    com.mapgame: DEBUG
